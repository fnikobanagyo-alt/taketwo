# PROTOTYPE (map ticket #7): does the Candle Qwen3-TTS CLI build on Windows with CUDA?
# GitHub's Windows runners have no NVIDIA GPU, so this proves the build only; sound needs a real NVIDIA PC.
name: Windows CUDA build (prototype)
on:
  push:
    branches: [prototype/qwen3-tts-rust]
    paths: [prototypes/**, .github/workflows/windows-cuda-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        features: ["cuda,audio-loading", "cuda,flash-attn,audio-loading"]
    env:
      CUDA_COMPUTE_CAP: "86"   # no GPU on the runner to detect; 86 = RTX 30-series
    steps:
      - uses: actions/checkout@v4
      - name: Allow long paths (flash-attn's cutlass checkout has very long file names)
        run: git config --system core.longpaths true
      - uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev", "visual_studio_integration"]'
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1   # puts cl.exe (MSVC) on PATH; nvcc needs it as the host compiler
      - name: Build (${{ matrix.features }})
        working-directory: prototypes/qwen3-tts-rs-fork
        shell: pwsh   # not bash: Git's /usr/bin/link.exe would shadow MSVC's linker
        run: |
          nvcc --version
          (Get-Command link.exe).Source
          cargo build --release -p qwen_tts_cli --features "${{ matrix.features }}" 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item target/release/qwen-tts.exe | Select-Object Name, Length
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ strategy.job-index }}
          path: prototypes/qwen3-tts-rs-fork/build.log
          if-no-files-found: ignore
