# Runs the release checks (scripts/check.py) on every push and pull request.
# Linux runner: GitHub's Apple Silicon runners are often unavailable, and the tests never load a model.
# MLX only installs on Apple Silicon, so it is left out here; the full install (./start.sh --setup) is
# checked on a Mac before each release.
name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install the engine's packages (without the Apple-only MLX ones)
        run: |
          python -m venv backend/.venv
          grep -v -E '^mlx(-audio)?==' backend/requirements.lock > /tmp/requirements-linux.txt
          backend/.venv/bin/python -m pip install -q --disable-pip-version-check -r /tmp/requirements-linux.txt
      - name: Install the interface's packages
        run: cd frontend && npm ci --silent
      - name: Run checks on a temporary library
        run: backend/.venv/bin/python -B scripts/check.py
