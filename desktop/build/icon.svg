<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- TakeTwo mark: one waveform, muted first half (your recording), ember second half (the cloned voice) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24201c"/><stop offset="1" stop-color="#0f0d0b"/>
    </linearGradient>
    <linearGradient id="em" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc061"/><stop offset=".48" stop-color="#ff7a2f"/><stop offset="1" stop-color="#e4486e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".68" cy=".55" r=".5">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity=".28"/><stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#glow)"/>
  <!-- 40-unit logo scaled by 20.6 into the 824 tile -->
  <g transform="translate(100 100) scale(20.6)" stroke-linecap="round" stroke-width="2.3" fill="none">
    <path d="M8 18v4M11.5 14v12M15 16.5v7M18.5 12v16" stroke="#f4efe9" stroke-opacity=".5"/>
    <path d="M21.5 12v16M25 15v10M28.5 11v18M32 17v6" stroke="url(#em)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#hl)"/>
  <rect x="101" y="101" width="822" height="822" rx="189" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
</svg>
