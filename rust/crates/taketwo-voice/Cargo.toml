[package]
name = "taketwo-voice"
description = "TakeTwo models behind traits (voice, transcriber, speaker encoder, restorer)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
# One switch for every GPU piece: Candle (qwen_tts) and whisper.cpp both build for CUDA.
cuda = ["qwen_tts/cuda"]
flash-attn = ["cuda", "qwen_tts/flash-attn"]
# Metal for Candle and whisper.cpp (S13); whisper.cpp still runs on the CPU unless the caller asks for the GPU.
metal = ["qwen_tts/metal"]

[dependencies]
qwen_tts = { path = "../../vendor/qwen_tts" }
candle-core = "0.9"
# download-binaries: ort-sys fetches pyke's prebuilt ONNX Runtime at build time and links it
# statically on macOS arm64 and Windows x64, so no DLL ships beside the exe for the CPU provider.
serde = { version = "1", features = ["derive"] }
taketwo-core = { path = "../taketwo-core" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-31"] }

[dev-dependencies]
hound = "3"
libc = "0.2"

[build-dependencies]
cc = "1"
cmake = "0.1"
