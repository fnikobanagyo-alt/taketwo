[package]
name = "taketwo-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
cuda = ["taketwo-voice/cuda"]
metal = ["taketwo-voice/metal"]
flash-attn = ["taketwo-voice/flash-attn"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
dirs = "6"
form_urlencoded = "1"
hound = "3.5"
percent-encoding = "2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
taketwo-core = { path = "../taketwo-core" }
taketwo-voice = { path = "../taketwo-voice" }

[dev-dependencies]
libc = "0.2"
http-body-util = "0.1"
tempfile = "3"
