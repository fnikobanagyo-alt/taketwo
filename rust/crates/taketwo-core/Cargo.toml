[package]
name = "taketwo-core"
description = "TakeTwo pure logic: paths and isolation rules, text, checks, library store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dirs = "6"
fancy-regex = "0.17"
num-bigint = "0.4"
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
