[package]
name = "taketwo-core"
description = "TakeTwo pure logic: paths and isolation rules, text, checks, library store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dirs = "6"
fancy-regex = "0.17"
hound = "3.5"
num-bigint = "0.4"
realfft = "3.5"
regex = "1"
sci-rs = "0.4"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
unicode-normalization = "0.1"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
